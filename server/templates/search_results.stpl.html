<div class="bg-white rounded-2xl shadow-lg p-6">
  <h2 class="text-xl font-bold text-gray-900 mb-4">Results for “{{ query }}”</h2>

  <ul class="space-y-3">
    {{ for result in results }}
      <li class="p-4 rounded-xl border border-gray-200">
        {{ result }}
      </li>
    {{ end }}
  </ul>
</div>
