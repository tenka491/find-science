<h1>Log In</h1>

<p class="intro">If you don't have an account, please <a href="/signup" class="link">sign up</a> 
to continue.
</p>

<form method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="<%= self.csrf_token %>">
    <label>
        <span class="label-text">Email Address:</span>
        <input type="email" name="email" required 
            value="shanetconnor+test_user_001@gmail.com">
    </label>

    <label>
        <span class="label-text">Password:</span>
        <input type="password" name="password" required
            value="Password1!">
    </label>

    <button type="reset"
        class="button-secondary mr-1">
        Cancel
    </button>

    <button type="submit"
        class="button-primary">
        Log In
    </button>
</form>
