    <form id="search-form" hx-post="/search/results" hx-target="#results-container" hx-swap="innerHTML" class="">

      <!-- Keyword -->
      <label for="keywords" class="block mb-4">
        <span class="text-gray-700 font-medium">Search Projects & Events</span>
        <input
          value="mammals"
          type="text" id="keyword" name="keywords"
          placeholder="e.g. butterflies, space" 
          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </label>

      <!-- Latitude & Longitude -->
        <label for="latitude" class="block mb-4">
          <span class="font-medium text-gray-700">Latitude</span>

          <input type="number" id="latitude" name="latitude" step="any"
          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </label>
        <label for="longitude" class="block mb-4">
          <span class="font-medium text-gray-700">Longitude</span>

          <input type="number" id="longitude" name="longitude" step="any"
          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </label>

      <!-- Submit Button -->
        <button type="submit"
                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
          Search
        </button>

    </form>

<!-- Results Section -->
