<% for p in self.projects { %>

<div class="mb-4 bg-gray-50 rounded-lg border border-neutral-light overflow-hidden hover:shadow-lg transition">
  <a href="<%= p.link %>">

    <img src="<%= p.image %>" class="w-full h-48 object-cover">

    <div class="p-4 space-y-2">

      <h2 class="text-xl font-semibold text-primary">
        <%= p.title %>
      </h2>

      <p class="text-sm">
        <strong class="text-gray-600">Goal:</strong> <%= p.goal %>
      </p>

      <p class="text-sm">
        <strong class="text-gray-600">Task:</strong> <%= p.task %>
      </p>

    </div>
  </a>

</div>

<% } %>
