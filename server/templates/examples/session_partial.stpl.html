<% if self.username.is_empty() { %>
<p class="text-gray-600 mb-3">You are not logged in.</p>
<form hx-post="/login" hx-target="#session-section" hx-swap="innerHTML" class="flex gap-3 items-end">
    <label class="flex flex-col">
        <span class="text-sm text-gray-600 mb-1">Set your name:</span>
        <input type="text" name="username" required
            class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
    </label>
    <button type="submit"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
        Save to Session
    </button>
</form>
<% } else { %>
<p class="text-gray-600 mb-3">
    Logged in as: <span class="font-semibold text-blue-600"><%= self.username %></span>
</p>
<form hx-post="/logout" hx-target="#session-section" hx-swap="innerHTML">
    <button type="submit"
        class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors">
        Clear Session
    </button>
</form>
<% } %>
