<div class="min-h-screen bg-gray-900 flex flex-col items-center">
  <div class="w-full max-w-2xl p-6">
    <form
      id="searchForm"
      hx-post="/search/results"
      hx-target="#results"
      hx-swap="innerHTML"
      class="flex gap-2"
    >
      <input type="hidden" name="csrf_token" value="<%= self.csrf_token %>">
      <input
        name="query"
        type="text"
        placeholder="Search..."
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button
        type="submit"
        class="px-6 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
      >
        Search
      </button>
    </form>
  </div>

  <!-- results will be injected here -->
  <div id="results" class="w-full max-w-2xl p-6"></div>
</div>
