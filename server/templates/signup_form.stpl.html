<h1>Sign Up</h1>

<p class="intro">Already have an account? <a href="/login" class="link">Log In here</a>.</p>

<form method="POST" action="/signup">
    <input type="hidden" name="csrf_token" value="<%= self.csrf_token %>">
    <label>
        <span class="label-text">Username:</span>
        <input type="text" name="username" required>
    </label>
    <label>
        <span class="label-text">Email Address:</span>
        <input type="email" name="email" required>
    </label>
    <label>
        <span class="label-text">Zip/Postal Code:</span>
        <input type="text" name="zip" required>
    </label>
    <label>
        <span class="label-text">Password:</span>
        <input type="password" name="password" required>
    </label>
    <label>
        <span class="label-text">Confirm Password:</span>
        <input type="password" name="confirm_password" required>
    </label>

    <button type="reset"
        class="button-secondary mr-1">
        Cancel
    </button>

    <button type="submit"
        class="button-primary">
        Sign Up
    </button>
    <div id="messages" class="mt-4"></div>
</form>
