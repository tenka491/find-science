[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
poem = { version = "3.1.12", features = ["server", "cookie", "csrf", "multipart", "session", "sse", "anyhow", "embed"] }
rust-embed = "8.5"
reqwest = { version = "0.12", features = ["json"] }
sailfish = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-stream = "0.3"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = "0.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
argon2 = "0.5"
rand_core = "0.6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1.89"
base64 = "0.22.1"
dotenvy = "0.15"
urlencoding = "2.1.3"
