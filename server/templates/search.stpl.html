<!-- TODO: Fix stylings everything is bunched together but this is good enough to move on to the next thing. -->
<header class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Acme Science Finder</h1>
  </div>
</header>

  <!-- Search Form -->
<section id="search-section">
  <div class="bg-white shadow-md rounded-lg p-6 space-y-4">

<form id="search-form" hx-get="/finder/results" hx-target="#results-container" hx-swap="innerHTML" class="grid grid-cols-1 lg:grid-cols-3 gap-4">

  <!-- Keyword -->
  <div>
    <label for="keyword" class="block text-sm font-medium text-gray-700">Search</label>
    <input type="text" id="keyword" name="keyword" placeholder="Search projects & events"
      class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <!-- Latitude -->
  <div>
    <label for="latitude" class="block text-sm font-medium text-gray-700">Latitude</label>
    <input type="number" id="latitude" name="latitude" step="any"
      class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <!-- Longitude -->
  <div>
    <label for="longitude" class="block text-sm font-medium text-gray-700">Longitude</label>
    <input type="number" id="longitude" name="longitude" step="any"
      class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <!-- Filters -->
  <div class="lg:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-4 mt-2">
    <div class="flex items-center space-x-2">
      <input id="events" name="events" type="checkbox" checked class="h-4 w-4 text-indigo-600 border-gray-300 rounded"/>
      <label for="events" class="text-sm text-gray-700">Events</label>
    </div>
    <div class="flex items-center space-x-2">
      <input id="projects" name="projects" type="checkbox" checked class="h-4 w-4 text-indigo-600 border-gray-300 rounded"/>
      <label for="projects" class="text-sm text-gray-700">Projects</label>
    </div>
    <div class="flex items-center space-x-2">
      <input id="active" name="active" type="checkbox" checked class="h-4 w-4 text-indigo-600 border-gray-300 rounded"/>
      <label for="active" class="text-sm text-gray-700">Active</label>
    </div>
    <div class="flex items-center space-x-2">
      <input id="upcoming" name="upcoming" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded"/>
      <label for="upcoming" class="text-sm text-gray-700">Upcoming</label>
    </div>
  </div>

  <!-- Submit -->
  <div class="lg:col-span-3 text-right">
    <button type="submit"
      class="px-6 py-2 primary text-white font-semibold rounded-lg hover:bg-indigo-700 transition">
      Search
    </button>
  </div>

</form>

</div>

</section>

<!-- Results -->
<section id="results-section" class="space-y-4">
  <div id="results-container" hx-get="/results" hx-trigger="load" hx-target="#results-container" hx-swap="innerHTML">
    <!-- HTMX will populate result cards here -->
  </div>
</section>
