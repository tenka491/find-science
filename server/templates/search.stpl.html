  <form id="search-form" hx-get="/search/results" hx-target="#results-container" hx-swap="innerHTML">

    <!-- Keyword -->
    <label for="keywords">
      <span class="label-text">Search Projects & Events</span>
      <input
        value=""
        type="text" id="keyword" name="keywords"
        placeholder="e.g. butterflies, space" >
    </label>

    <!-- Latitude & Longitude -->
      <label for="latitude">
        <span class="label-text">Latitude</span>
        <input type="number" id="latitude" name="latitude" step="any">
      </label>
      <label for="longitude">
        <span class="label-text">Longitude</span>
        <input type="number" id="longitude" name="longitude" step="any">
      </label>

    <!-- Submit Button -->
      <button type="submit"
              class="button-primary">
        Search
      </button>

  </form>

<!-- Results Section -->
<div id="results-section" class="mt-6 max-w-7xl mx-auto space-y-4">
  <div id="results-container">
    <!-- HTMX will populate results here -->
  </div>
  <div id="load-more-container">
    <!-- button lands here -->
  </div>
</div>

<script>
  window.populateSearchResults = function(data) {
    document.getElementById('keyword').value = data.keywords[0];
    if(data.latitude != null){
      document.getElementById('latitude').value = data.latitude;
    }
    if(data.longitude != null){
      document.getElementById('longitude').value = data.longitude;
    }
    document.querySelector('button[type="submit"]').click();
  };
</script>
